    <circle cx="787" cy="295" r="5" fill="#a1a5ff" filter="url(#glow)"/>
    <text x="804" y="298" fill="#f1f1ff" font-size="16" font-weight="700">AURORA</text><text x="1000" y="298" fill="#bcc2e9" font-size="12">Self-hosted local AI developer tooling</text>
