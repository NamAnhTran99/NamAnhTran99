    <circle cx="787" cy="353" r="5" fill="#6dc9ed" filter="url(#glow)"/>
    <text x="804" y="356" fill="#e8f8ff" font-size="16" font-weight="700">EVAT</text><text x="1000" y="356" fill="#b2d5e5" font-size="12">Electric Vehicle Adoption Tool · team project</text>
  </g>

  <!-- Centre ECAM stack: lower display -->
  <rect x="732" y="440" width="554" height="274" rx="12" fill="#05090b" stroke="#819097" stroke-width="4"/>
  <rect x="746" y="454" width="526" height="246" rx="4" fill="url(#display)" stroke="#2e4047"/>
