  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="766" y="497" width="228" height="118" rx="4" fill="#111b20" stroke="#42616a"/>
    <text x="781" y="520" fill="#dcf5f4" font-size="14" font-weight="700">Guide My Eyes</text>
    <text x="781" y="543" fill="#86a7ae" font-size="11">Android assistive prototype</text>
    <text x="781" y="564" fill="#86a7ae" font-size="11">ARCore depth sensing</text>
    <text x="781" y="585" fill="#86a7ae" font-size="11">TensorFlow Lite detection</text>
    <rect x="1020" y="497" width="232" height="118" rx="4" fill="#111b20" stroke="#42616a"/>
    <text x="1035" y="520" fill="#dcf5f4" font-size="14" font-weight="700">Selected contribution</text>
