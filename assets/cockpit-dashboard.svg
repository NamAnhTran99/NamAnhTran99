<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Captain-side A320-inspired software portfolio</title>
  <desc id="desc">The captain-side PFD and ND sit on the left of the cockpit composition. Upper and lower ECAM displays on the centre-right show portfolio projects, project detail and toolkit.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1c252a"/><stop offset="1" stop-color="#090d10"/></linearGradient>
    <linearGradient id="display" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#101b20"/><stop offset="1" stop-color="#050c10"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2876a6"/><stop offset="0.49" stop-color="#2876a6"/><stop offset="0.5" stop-color="#e9f6f5"/><stop offset="0.515" stop-color="#866544"/><stop offset="1" stop-color="#4e3b29"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="texture" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#a9dfe2" stroke-opacity=".035"/></pattern>
  </defs>

  <!-- Cockpit shell and captain-side glareshield -->
  <rect width="1400" height="820" rx="18" fill="#030506"/>
  <path d="M22 784V82Q22 42 62 42H1338Q1378 42 1378 82V784Q1378 804 1358 804H42Q22 804 22 784Z" fill="url(#panel)" stroke="#68777d" stroke-width="2"/>
  <path d="M43 123L72 78H1110L1183 123V144H43Z" fill="#060a0c" stroke="#49575d" stroke-width="2"/>
  <rect x="58" y="58" width="1008" height="46" rx="7" fill="#0d1316" stroke="#536167"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="78" fill="#8e9ba0" font-size="10" letter-spacing="2">CAPTAIN SIDE / PORTFOLIO DISPLAY</text>
    <text x="82" y="95" fill="#e9f1f1" font-size="17" font-weight="700">NAM ANH TRAN [ TOM ]</text>
    <text x="470" y="78" fill="#8e9ba0" font-size="10" letter-spacing="2">FULL-STACK SOFTWARE ENGINEER</text>
    <text x="470" y="95" fill="#c6f0ec" font-size="15">APPLIED AI · ROBOTICS · GIS · WEB PLATFORMS</text>
  </g>
  <!-- FCU controls: silhouette only -->
  <g transform="translate(1090 58)" fill="#161e22" stroke="#657277">
    <rect width="250" height="46" rx="5"/><circle cx="32" cy="23" r="12"/><circle cx="83" cy="23" r="12"/><circle cx="134" cy="23" r="12"/><rect x="164" y="14" width="28" height="18" rx="2"/><rect x="203" y="14" width="28" height="18" rx="2"/>
  </g>
  <path d="M43 145H1357V778H43Z" fill="url(#texture)"/>

  <!-- Captain PFD bezel -->
  <rect x="62" y="165" width="293" height="292" rx="12" fill="#05090b" stroke="#819097" stroke-width="4"/>
  <rect x="74" y="177" width="269" height="268" rx="4" fill="url(#display)" stroke="#2e4047"/>
  <text x="88" y="199" fill="#5cd7dd" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">PFD · ABOUT</text>
