    <text x="1035" y="564" fill="#86a7ae" font-size="11">Real-time telemetry views</text>
    <text x="1035" y="585" fill="#86a7ae" font-size="11">Data-driven application features</text>
    <path d="M766 634H1252" stroke="#2f4b51"/>
    <text x="766" y="657" fill="#8ea6ad" font-size="10" letter-spacing="2">TOOLKIT</text>
    <text x="842" y="657" fill="#e4f1f1" font-size="13">TypeScript · Angular · .NET · Python · React · Node.js · MongoDB · Docker · ROS 2</text>
    <text x="766" y="683" fill="#8ea6ad" font-size="10" letter-spacing="2">LINKEDIN</text>
    <text x="842" y="683" fill="#63e0bf" font-size="13">linkedin.com/in/thomas-tran-anh</text>
  </g>

