  <g fill="#131b1f" stroke="#5c6b70">
    <rect x="686" y="166" width="25" height="32" rx="3"/><rect x="686" y="207" width="25" height="32" rx="3"/><rect x="686" y="248" width="25" height="32" rx="3"/><rect x="686" y="289" width="25" height="32" rx="3"/><rect x="686" y="330" width="25" height="32" rx="3"/>
    <rect x="1308" y="166" width="25" height="32" rx="3"/><rect x="1308" y="207" width="25" height="32" rx="3"/><rect x="1308" y="248" width="25" height="32" rx="3"/><rect x="1308" y="289" width="25" height="32" rx="3"/><rect x="1308" y="330" width="25" height="32" rx="3"/>
    <rect x="686" y="463" width="25" height="32" rx="3"/><rect x="686" y="504" width="25" height="32" rx="3"/><rect x="686" y="545" width="25" height="32" rx="3"/><rect x="686" y="586" width="25" height="32" rx="3"/>
    <rect x="1308" y="463" width="25" height="32" rx="3"/><rect x="1308" y="504" width="25" height="32" rx="3"/><rect x="1308" y="545" width="25" height="32" rx="3"/><rect x="1308" y="586" width="25" height="32" rx="3"/>
  </g>
  <path d="M62 735H1286L1336 779H32Z" fill="#0b1013" stroke="#56656b" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <rect x="92" y="751" width="218" height="19" rx="3" fill="#12322d" stroke="#63e0bf"/><text x="201" y="765" fill="#d6fff3">CHASMATA-2027</text>
    <rect x="333" y="751" width="156" height="19" rx="3" fill="#20203a" stroke="#a1a5ff"/><text x="411" y="765" fill="#e4e5ff">AURORA</text>
    <rect x="512" y="751" width="132" height="19" rx="3" fill="#102b37" stroke="#6dc9ed"/><text x="578" y="765" fill="#e1f7ff">EVAT</text>
    <rect x="667" y="751" width="181" height="19" rx="3" fill="#302036" stroke="#e5a4e5"/><text x="757" y="765" fill="#ffe7ff">GUIDE MY EYES</text>
