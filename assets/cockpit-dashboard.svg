    <circle r="60" stroke="#5fd6db" stroke-opacity=".25"/>
    <path d="M0-104V104M-104 0H104M-74-74L74 74M74-74L-74 74" stroke="#5fd6db" stroke-opacity=".19"/>
    <path d="M-61 52C-39 16-11 24 13-10S47-25 71-64" stroke="#63e0bf" stroke-width="4"/>
